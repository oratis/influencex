name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Runtime is Node 20 (see Dockerfile). Tests rely on globals like
        # `File` that are 20+, and the test runner's glob expansion behaves
        # differently on 18; keeping 18 in the matrix adds noise without
        # matching any real deployment.
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install server dependencies
        # --legacy-peer-deps mirrors the Dockerfile: the OTel
        # auto-instrumentations suite has an ERESOLVE peer conflict.
        # Root .npmrc covers local installs; the explicit flag keeps CI
        # working even if that file moves.
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

  client-test:
    name: Client unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        # Mirrors the Dockerfile; see client/.npmrc for why.
        run: npm ci --legacy-peer-deps

      - name: Run Vitest component tests
        working-directory: client
        # Vitest auto-detects client/vitest.config.js (jsdom + setup file).
        run: npx vitest run

  build:
    name: Build client
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        # Mirrors the Dockerfile; see client/.npmrc for why.
        run: npm ci --legacy-peer-deps

      - name: Build client
        working-directory: client
        run: npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    # A red e2e job is a red build — this suite covers login, the invite-only
    # signup loop and pipeline approve, i.e. the three flows that must never
    # silently break. No continue-on-error on purpose.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install server dependencies
        # Same ERESOLVE workaround as the unit-test job.
        run: npm ci --legacy-peer-deps

      - name: Install client dependencies
        working-directory: client
        run: npm ci --legacy-peer-deps

      - name: Build client
        # The Express server serves client/dist; the Playwright config
        # deliberately builds nothing itself.
        working-directory: client
        run: npx vite build

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite
        # The config boots `node server/index.js` against a throwaway SQLite
        # file in the runner's tmpdir (SQLITE_DB_PATH) and seeds it with
        # server/seed-demo.js — no external services are contacted.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  lint:
    name: Server syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Syntax check all server JS files
        run: |
          for f in $(find server -name '*.js' ! -path 'server/__tests__/*'); do
            node --check "$f" || exit 1
          done
